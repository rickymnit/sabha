# CI (plan task P1.2). Lint and tests run the same Makefile targets developers run locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"
  PNPM_VERSION: "10.33.4"
  NODE_VERSION: "22.23.0"

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    # 25, not 15: on 2026-10-23 installing ffmpeg from Ubuntu's mirrors alone took 13 minutes and the tests were
    # cancelled before they ran.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # ffmpeg/ffprobe for the preprocess stage tests (P3.2); the worker images install it too.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Lint first: a lint failure stops the job before the slower tests.
      - run: make lint-py
      # Integration tests start MongoDB (replica set) with testcontainers on the runner's Docker.
      - run: make test-py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: ignore

  web:
    name: Web (eslint, prettier, tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    name: Security (pip-audit, pnpm audit, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: pip-audit (third-party Python dependencies from uv.lock)
        run: |
          uv export --frozen --no-emit-workspace --all-packages --format requirements-txt > requirements-audit.txt
          uvx pip-audit==2.10.0 --strict --disable-pip --requirement requirements-audit.txt
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: pnpm audit (high and critical)
        working-directory: apps/web
        run: pnpm audit --audit-level=high
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1

  # Off until the API entry point (P1.4) and the Celery app (P2.4) exist. To turn on, set the repository
  # variable PUBLISH_IMAGES to "true" (Settings → Secrets and variables → Actions → Variables).
  images:
    name: Build and push images
    if: vars.PUBLISH_IMAGES == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: workers-cpu
            dockerfile: apps/workers/Dockerfile.cpu
          - name: workers-gpu
            dockerfile: apps/workers/Dockerfile.gpu
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sabha-${{ matrix.name }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
