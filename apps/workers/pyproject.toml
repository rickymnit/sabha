[project]
name = "sabha-workers"
version = "0.0.0"
description = "Sabha pipeline workers (Celery) and the outbox relay."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "sabha-core",
    "sabha-asr",
    "sabha-llm",
    "sabha-analytics",
    "redis>=5.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout (apps/workers/sabha_workers), as CLAUDE.md names the paths.
module-name = "sabha_workers"
module-root = ""
