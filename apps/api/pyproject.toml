[project]
name = "sabha-api"
version = "0.0.0"
description = "Sabha HTTP API (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35",
  "fastapi>=0.142,<0.142.3",
  "httpx>=0.28",
  "opentelemetry-instrumentation-fastapi==0.66b1",
  "pyjwt[crypto]>=2.10",
  "pymongo>=4.9",
  "redis>=5.0",
  "sabha-analytics",  # the rubric loader, so the API reads rubric files exactly as scoring does (P6.8)
  "sabha-core",
  "uvicorn>=0.54",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout (apps/api/sabha_api), as CLAUDE.md names the paths.
module-name = "sabha_api"
module-root = ""
