[project]
name = "sabha-asr"
version = "0.0.0"
description = "Multi-provider speech recognition."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "sabha-core",
]

[project.optional-dependencies]
# Speaker diarization (P3.4): installed only for the speech worker and on dev machines (`make setup-speech`), so the
# API, the CPU worker and CI never pull in PyTorch. torch/torchaudio come from PyTorch's CPU index (root pyproject).
diarization = [
    "pyannote.audio>=4.0.7,<4.1",
    "torch>=2.8",
    "torchaudio>=2.8",
]

[project.scripts]
sabha-asr-transcribe = "sabha_asr.cli:main"  # transcribe one WAV with the configured provider (P3.1)

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout (packages/asr/sabha_asr), as CLAUDE.md names the paths.
module-name = "sabha_asr"
module-root = ""
