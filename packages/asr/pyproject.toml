[project]
name = "sabha-asr"
version = "0.0.0"
description = "Multi-provider speech recognition, ported from LIS."
requires-python = ">=3.12,<3.13"
dependencies = ["sabha-core"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout (packages/asr/sabha_asr), as CLAUDE.md names the paths.
module-name = "sabha_asr"
module-root = ""
